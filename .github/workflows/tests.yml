name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "8.*"
            testbench: "6.*"
            phpunit: "9.6.*"
            php: "8.1"
          - laravel: "9.*"
            testbench: "7.*"
            phpunit: "9.6.*"
            php: "8.1"
          - laravel: "10.*"
            testbench: "8.*"
            phpunit: "10.*"
            php: "8.1"
          - laravel: "11.*"
            testbench: "9.*"
            phpunit: "10.*"
            php: "8.2"
          - laravel: "12.*"
            testbench: "10.*"
            phpunit: "11.*"
            php: "8.2"
          - laravel: "13.*"
            testbench: "11.*"
            phpunit: "11.*"
            php: "8.3"

    name: L${{ matrix.laravel }} / PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit
